name: My First Workflow

on: 
  push:
    branches:
      - master

jobs:
  say-hello:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Python version
        run: python --version

      - name: Run simple Python
        run: python -c "print('Hello from Python!')"

      - name: Calculate something
        run: |
          echo "2 + 2 = 4"
          echo "Python: $((5 * 3))"
          
      - name: This will fail
        run: exit 1 